<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Samartex Hospital - Admin Login</title>

    <link
        rel="stylesheet"
        href="style2.css"
    >

</head>

<body>

    <div class="login-container">

        <img
            src="images/logo.png"
            width="200"
            alt="Samartex Hospital Logo"
        >

        <h2>Admin Login</h2>

        <form id="adminLogin">

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Username"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>


    <script src="script1.js"></script>

</body>

</html>
