<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Samartex Hospital | Loading</title>


<style>

/* =====================================
   RESET
===================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =====================================
   BODY
===================================== */

body{

    min-height:100vh;

    overflow:hidden;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#123d2d;

    background:

        radial-gradient(
            circle at 50% 15%,
            #f5fff8 0%,
            #d8f2df 35%,
            #9fd0ae 70%,
            #43835b 100%
        );
}


/* =====================================
   BACKGROUND
===================================== */

.background{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;
}


/* =====================================
   SOFT LIGHTS
===================================== */

.light{

    position:absolute;

    width:500px;

    height:500px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.75),
            rgba(80,180,110,.12),
            transparent 70%
        );

    filter:blur(12px);

    animation:
        lightMove 10s ease-in-out infinite;
}


.light.one{

    top:-220px;

    left:-150px;
}


.light.two{

    right:-220px;

    bottom:-220px;

    animation-delay:4s;
}


@keyframes lightMove{

    0%,100%{

        transform:scale(1);

    }

    50%{

        transform:scale(1.25);

    }

}


/* =====================================
   MEDICAL ORBITS
===================================== */

.orbit{

    position:absolute;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(25,110,60,.14);

    border-radius:50%;

    animation:
        orbitPulse 6s ease-in-out infinite;
}


.orbit.one{

    width:500px;

    height:500px;
}


.orbit.two{

    width:700px;

    height:700px;

    animation-delay:1s;
}


.orbit.three{

    width:900px;

    height:900px;

    animation-delay:2s;
}


@keyframes orbitPulse{

    0%,100%{

        opacity:.3;

        transform:
            translate(-50%,-50%)
            scale(1);
    }

    50%{

        opacity:.7;

        transform:
            translate(-50%,-50%)
            scale(1.04);
    }

}


/* =====================================
   FLOATING HEARTS
===================================== */

.floating-heart{

    position:absolute;

    color:
        rgba(210,45,75,.15);

    font-size:25px;

    animation:
        floatHeart 12s linear infinite;
}


.h1{

    left:10%;

    bottom:-50px;
}


.h2{

    left:35%;

    bottom:-60px;

    animation-delay:4s;
}


.h3{

    right:12%;

    bottom:-50px;

    animation-delay:8s;
}


@keyframes floatHeart{

    0%{

        transform:
            translateY(0)
            scale(.6);

        opacity:0;
    }

    20%{

        opacity:.7;
    }

    100%{

        transform:
            translateY(-750px)
            scale(1.3);

        opacity:0;
    }

}


/* =====================================
   LUXURY GLASS CARD
===================================== */

.loader{

    width:92%;

    max-width:540px;

    padding:
        35px
        38px
        35px;

    position:relative;

    z-index:5;

    text-align:center;

    border-radius:35px;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.82),
            rgba(230,255,238,.40)
        );

    border:
        1px solid
        rgba(255,255,255,.95);

    backdrop-filter:
        blur(28px);

    -webkit-backdrop-filter:
        blur(28px);

    box-shadow:

        0 35px 90px
        rgba(18,85,45,.22),

        inset 0 1px 0
        rgba(255,255,255,.95),

        inset 0 -1px 0
        rgba(255,255,255,.35);

    overflow:hidden;
}


/* =====================================
   GLASS MIRROR REFLECTION
===================================== */

.loader::before{

    content:"";

    position:absolute;

    width:180%;

    height:180px;

    top:-100px;

    left:-45%;

    background:

        linear-gradient(
            120deg,
            transparent 30%,
            rgba(255,255,255,.85) 48%,
            transparent 65%
        );

    transform:rotate(-8deg);

    animation:
        mirrorShine 8s ease-in-out infinite;

    pointer-events:none;
}


@keyframes mirrorShine{

    0%{

        transform:
            translateX(-60%)
            rotate(-8deg);
    }

    50%{

        transform:
            translateX(35%)
            rotate(-8deg);
    }

    100%{

        transform:
            translateX(125%)
            rotate(-8deg);
    }

}


/* =====================================
   SAMARTEX LOGO
===================================== */

.logo-container{

    width:220px;

    height:180px;

    margin:
        0 auto 8px;

    position:relative;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.96),
            rgba(228,250,235,.65)
        );

    border:
        3px solid
        rgba(255,255,255,.92);

    box-shadow:

        0 18px 45px
        rgba(20,100,55,.18),

        inset 0 2px 10px
        rgba(255,255,255,.9);

    animation:
        logoPulse 3s ease-in-out infinite;
}


/*
   Your uploaded Samartex logo.
*/

.logo-container img{

    position:absolute;

    width:270px;

    max-width:none;

    height:auto;

    left:50%;

    top:-5px;

    transform:
        translateX(-50%);

    /*
       Removes the black background
       of the uploaded logo.
    */

    mix-blend-mode:screen;

    filter:
        saturate(1.15)
        contrast(1.08);
}


/* Gold ring */

.logo-container::after{

    content:"";

    position:absolute;

    inset:8px;

    border-radius:50%;

    border:
        1px solid
        rgba(181,138,66,.55);

    pointer-events:none;
}


@keyframes logoPulse{

    0%,100%{

        transform:scale(1);

    }

    50%{

        transform:scale(1.025);

    }

}


/* =====================================
   SAMARTEX HOSPITAL NAME
===================================== */

h1{

    font-size:32px;

    font-weight:800;

    letter-spacing:4px;

    color:#123d2d;

    text-shadow:
        0 1px 0 white;
}


.gold-line{

    width:75px;

    height:2px;

    margin:
        12px auto;

    background:

        linear-gradient(
            90deg,
            transparent,
            #b58a42,
            transparent
        );
}


.subtitle{

    font-size:11px;

    letter-spacing:3px;

    color:#567a67;

    text-transform:uppercase;
}


/* =====================================
   ECG MONITOR
===================================== */

.ecg-box{

    width:100%;

    height:85px;

    margin-top:28px;

    position:relative;

    overflow:hidden;

    border-radius:20px;

    background:
        rgba(255,255,255,.58);

    border:
        1px solid
        rgba(255,255,255,.9);

    box-shadow:

        inset 0 1px 5px
        rgba(255,255,255,.9),

        0 10px 30px
        rgba(20,100,55,.08);
}


/* ECG grid */

.ecg-box::before{

    content:"";

    position:absolute;

    inset:0;

    opacity:.3;

    background-image:

        linear-gradient(
            rgba(35,125,75,.13) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(35,125,75,.13) 1px,
            transparent 1px
        );

    background-size:20px 20px;
}


/* =====================================
   CONTINUOUS ECG TRACK
===================================== */

.ecg-track{

    position:absolute;

    width:200%;

    height:100%;

    left:0;

    top:0;

    display:flex;

    animation:
        ecgMove 3.5s linear infinite;
}


.ecg-track svg{

    width:50%;

    height:100%;

    flex-shrink:0;
}


.ecg-track polyline{

    fill:none;

    stroke:#d23855;

    stroke-width:3;

    stroke-linecap:round;

    stroke-linejoin:round;

    filter:
        drop-shadow(
            0 0 5px
            rgba(210,56,85,.45)
        );
}


/*
   The ECG keeps moving continuously.
*/

@keyframes ecgMove{

    from{

        transform:
            translateX(0);
    }

    to{

        transform:
            translateX(-50%);
    }

}


/* =====================================
   LOADING AREA
===================================== */

.loading-area{

    margin-top:26px;
}


.percentage{

    font-size:43px;

    font-weight:700;

    color:#24784b;

    letter-spacing:1px;
}


.loading-message{

    height:25px;

    margin-top:5px;

    font-size:13px;

    color:#60806d;
}


/* =====================================
   PROGRESS BAR
===================================== */

.progress-container{

    width:100%;

    height:8px;

    margin-top:19px;

    border-radius:20px;

    overflow:hidden;

    background:
        rgba(25,100,55,.12);
}


.progress{

    width:0%;

    height:100%;

    border-radius:20px;

    background:

        linear-gradient(
            90deg,
            #d23855,
            #b58a42,
            #21824f
        );

    box-shadow:
        0 0 15px
        rgba(35,130,80,.35);

    transition:
        width .25s ease;
}


/* =====================================
   SECURITY
===================================== */

.secure{

    margin-top:18px;

    font-size:9px;

    letter-spacing:2px;

    color:#708b79;
}


.secure span{

    color:#13825d;

    margin-right:5px;
}


/* =====================================
   MOBILE
===================================== */

@media(max-width:500px){

    .loader{

        padding:
            28px
            18px
            30px;

        border-radius:28px;
    }


    .logo-container{

        width:175px;

        height:150px;
    }


    .logo-container img{

        width:225px;
    }


    h1{

        font-size:25px;

        letter-spacing:3px;
    }


    .subtitle{

        font-size:9px;

        letter-spacing:2px;
    }


    .percentage{

        font-size:37px;
    }

}

</style>

</head>


<body>


<!-- =====================================
     BACKGROUND
===================================== -->

<div class="background">

    <div class="light one"></div>

    <div class="light two"></div>

    <div class="orbit one"></div>

    <div class="orbit two"></div>

    <div class="orbit three"></div>

    <div class="floating-heart h1">
        ♥
    </div>

    <div class="floating-heart h2">
        ♥
    </div>

    <div class="floating-heart h3">
        ♥
    </div>

</div>



<!-- =====================================
     MAIN LOADER
===================================== -->

<main class="loader">


    <!-- =================================
         SAMARTEX LOGO
    ================================== -->

    <div class="logo-container">

        <img
            src="/image/logo.png"
            alt="Samartex Hospital Logo">

    </div>



    <!-- =================================
         HOSPITAL NAME
    ================================== -->

    <h1>
        SAMARTEX HOSPITAL
    </h1>


    <div class="gold-line"></div>


    <p class="subtitle">
        Smart Healthcare • Better Care
    </p>



    <!-- =================================
         ECG
    ================================== -->

    <div class="ecg-box">

        <div class="ecg-track">


            <!-- ECG 1 -->

            <svg
                viewBox="0 0 1000 85"
                preserveAspectRatio="none">

                <polyline points="
                    0,42
                    80,42
                    120,42
                    145,42
                    160,42
                    175,17
                    190,67
                    205,42
                    285,42
                    325,42
                    345,42
                    360,42
                    375,12
                    390,70
                    405,42
                    485,42
                    525,42
                    545,42
                    560,42
                    575,18
                    590,66
                    605,42
                    685,42
                    725,42
                    745,42
                    760,42
                    775,12
                    790,70
                    805,42
                    885,42
                    925,42
                    945,42
                    960,42
                    975,18
                    990,66
                    1000,42
                "/>

            </svg>



            <!-- ECG 2 -->

            <svg
                viewBox="0 0 1000 85"
                preserveAspectRatio="none">

                <polyline points="
                    0,42
                    80,42
                    120,42
                    145,42
                    160,42
                    175,17
                    190,67
                    205,42
                    285,42
                    325,42
                    345,42
                    360,42
                    375,12
                    390,70
                    405,42
                    485,42
                    525,42
                    545,42
                    560,42
                    575,18
                    590,66
                    605,42
                    685,42
                    725,42
                    745,42
                    760,42
                    775,12
                    790,70
                    805,42
                    885,42
                    925,42
                    945,42
                    960,42
                    975,18
                    990,66
                    1000,42
                "/>

            </svg>

        </div>

    </div>



    <!-- =================================
         LOADING
    ================================== -->

    <section class="loading-area">


        <div
            class="percentage"
            id="percentage">

            0%

        </div>



        <div
            class="loading-message"
            id="message">

            Preparing your healthcare experience...

        </div>



        <!-- Progress -->

        <div class="progress-container">

            <div
                class="progress"
                id="progress">

            </div>

        </div>



        <!-- Security -->

        <div class="secure">

            <span>●</span>

            PRIVATE • SECURE • HEALTHCARE

        </div>


    </section>

</main>



<script>

/* =====================================
   SAMARTEX HOSPITAL LOADING
===================================== */


let progress = 0;


const percentage =
    document.getElementById("percentage");


const progressBar =
    document.getElementById("progress");


const message =
    document.getElementById("message");



/* Loading messages */

const messages = [

    "Preparing your healthcare experience...",

    "Loading Samartex Hospital services...",

    "Preparing patient services...",

    "Connecting medical services...",

    "Checking secure connection...",

    "Preparing your healthcare dashboard...",

    "Loading hospital services...",

    "Finalizing healthcare system...",

    "Almost ready...",

    "Welcome to Samartex Hospital!"

];



/*
   100 steps × 300 milliseconds
   = approximately 30 seconds.
*/


const loader = setInterval(function(){


    progress++;


    /* Percentage */

    percentage.textContent =
        progress + "%";


    /* Progress bar */

    progressBar.style.width =
        progress + "%";



    /* Loading messages */

    if(progress < 10){

        message.textContent =
            messages[0];

    }


    else if(progress < 20){

        message.textContent =
            messages[1];

    }


    else if(progress < 30){

        message.textContent =
            messages[2];

    }


    else if(progress < 40){

        message.textContent =
            messages[3];

    }


    else if(progress < 50){

        message.textContent =
            messages[4];

    }


    else if(progress < 65){

        message.textContent =
            messages[5];

    }


    else if(progress < 80){

        message.textContent =
            messages[6];

    }


    else if(progress < 92){

        message.textContent =
            messages[7];

    }


    else if(progress < 100){

        message.textContent =
            messages[8];

    }


    else{


        /* 100% */

        message.textContent =
            messages[9];


        clearInterval(loader);



        /*
           Keep 100% visible
           before opening index.html.
        */

        setTimeout(function(){


            window.location.href =
                "index.html";


        },1500);

    }


},300);

</script>


</body>
</html>
