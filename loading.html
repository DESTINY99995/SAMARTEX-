<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Samartex Hospital Emergency</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial, sans-serif;
    background:#9fc7ce;
}


/* =========================
   SCENE
========================= */

.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(
        #8dbbc4 0%,
        #c9dddd 45%,
        #778269 45%,
        #3d4445 100%
    );
}


/* =========================
   SKY
========================= */

.sky{
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        rgba(255,255,255,.12),
        rgba(0,0,0,.05)
    );
}


/* =========================
   TREES
========================= */

.trees{
    position:absolute;
    bottom:42%;
    left:0;
    width:100%;
    height:120px;

    background:
    radial-gradient(circle at 5% 100%,#35654b 0 45px,transparent 46px),
    radial-gradient(circle at 20% 100%,#416e52 0 55px,transparent 56px),
    radial-gradient(circle at 38% 100%,#356149 0 45px,transparent 46px),
    radial-gradient(circle at 55% 100%,#477357 0 60px,transparent 61px),
    radial-gradient(circle at 75% 100%,#35634b 0 50px,transparent 51px),
    radial-gradient(circle at 95% 100%,#416d51 0 55px,transparent 56px);
}


/* =========================
   HOSPITAL
========================= */

.hospital{
    position:absolute;

    right:5%;
    bottom:40%;

    width:470px;
    height:230px;

    background:#f5f8f8;

    border:2px solid #c2cbcc;

    box-shadow:
    0 15px 30px rgba(0,0,0,.25);
}

.hospital:before{
    content:"";

    position:absolute;

    left:-10px;
    top:-15px;

    width:calc(100% + 20px);
    height:15px;

    background:#08766a;
}


/* Hospital name */

.hospital-name{
    position:absolute;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    padding:9px 20px;

    background:#08766a;

    color:white;

    font-size:17px;
    font-weight:bold;

    letter-spacing:2px;

    white-space:nowrap;
}


/* =========================
   WINDOWS
========================= */

.windows{
    position:absolute;

    left:25px;
    right:25px;
    top:80px;

    display:flex;
    justify-content:space-between;
}

.window{
    width:60px;
    height:60px;

    background:
    linear-gradient(
        135deg,
        #315b65,
        #9fc5ca
    );

    border:5px solid white;
}


/* =========================
   ENTRANCE
========================= */

.entrance{
    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:115px;
    height:145px;

    background:#d9e4e5;

    border:2px solid #b7c3c4;
}

.entrance:after{
    content:"";

    position:absolute;

    left:10px;
    right:10px;
    top:10px;
    bottom:0;

    background:
    linear-gradient(
        90deg,
        #456e75 0 47%,
        white 47% 53%,
        #456e75 53%
    );
}


/* =========================
   COMPOUND
========================= */

.compound{
    position:absolute;

    left:0;
    bottom:25%;

    width:100%;
    height:17%;

    background:
    linear-gradient(
        #979884,
        #6c6e63
    );
}


/* =========================
   ROAD
========================= */

.road{
    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:28%;

    background:
    linear-gradient(
        #50585a,
        #292f31
    );

    z-index:5;
}

.road:before{
    content:"";

    position:absolute;

    top:7px;
    left:0;

    width:100%;
    height:4px;

    background:#ddd6ad;
}

.road:after{
    content:"";

    position:absolute;

    top:50%;

    left:0;

    width:100%;
    height:6px;

    background:
    repeating-linear-gradient(
        90deg,
        #eee3a4 0 70px,
        transparent 70px 145px
    );

    animation:roadMove .5s linear infinite;
}


/* =========================
   SPEED LINES
========================= */

.speed-lines{
    position:absolute;

    left:0;
    bottom:14%;

    width:100%;
    height:100px;

    z-index:15;

    pointer-events:none;
}

.speed-lines span{
    position:absolute;

    height:3px;

    background:rgba(255,255,255,.65);

    border-radius:10px;

    animation:speedLine .45s linear infinite;
}

.speed-lines span:nth-child(1){
    width:100px;
    top:20px;
    animation-delay:0s;
}

.speed-lines span:nth-child(2){
    width:160px;
    top:42px;
    animation-delay:.12s;
}

.speed-lines span:nth-child(3){
    width:70px;
    top:65px;
    animation-delay:.2s;
}

.speed-lines span:nth-child(4){
    width:130px;
    top:82px;
    animation-delay:.3s;
}


/* =========================
   AMBULANCE
========================= */

.ambulance{
    position:absolute;

    left:-240px;
    bottom:9%;

    width:215px;
    height:105px;

    z-index:25;

    animation:
    ambulanceSpeed
    6s
    cubic-bezier(.2,.7,.1,1)
    forwards;
}


/* =========================
   AMBULANCE BODY
========================= */

.body{
    position:absolute;

    left:5px;
    bottom:20px;

    width:200px;
    height:68px;

    background:
    linear-gradient(
        #ffffff,
        #e5ebec
    );

    border:2px solid #a9b3b5;

    border-radius:
    7px 15px 5px 5px;

    box-shadow:
    0 5px 5px rgba(0,0,0,.25);

    overflow:hidden;
}


/* Red stripe */

.red-stripe{
    position:absolute;

    left:0;
    bottom:10px;

    width:100%;
    height:10px;

    background:#c9252b;
}


/* =========================
   CROSS
========================= */

.cross{
    position:absolute;

    left:20px;
    top:12px;

    width:30px;
    height:30px;

    background:#c9252b;

    z-index:5;
}

.cross:before{
    content:"";

    position:absolute;

    left:10px;
    top:3px;

    width:10px;
    height:24px;

    background:white;
}

.cross:after{
    content:"";

    position:absolute;

    left:3px;
    top:10px;

    width:24px;
    height:10px;

    background:white;
}


/* =========================
   NAME
========================= */

.name{
    position:absolute;

    left:58px;
    top:20px;

    color:#b42026;

    font-size:10px;

    font-weight:bold;

    letter-spacing:1px;
}


/* =========================
   CAB
========================= */

.cab{
    position:absolute;

    right:3px;
    top:5px;

    width:82px;
    height:50px;

    background:
    linear-gradient(
        135deg,
        #24434a,
        #65858a
    );

    border:2px solid #aeb9ba;

    border-radius:
    4px 14px 3px 3px;
}


/* windshield */

.windshield{
    position:absolute;

    left:5px;
    top:5px;

    width:32px;
    height:34px;

    background:
    linear-gradient(
        135deg,
        #315963,
        #a4c3c7
    );

    border:2px solid #dce5e6;
}


/* side window */

.side-window{
    position:absolute;

    right:5px;
    top:5px;

    width:32px;
    height:34px;

    background:
    linear-gradient(
        135deg,
        #315963,
        #a4c3c7
    );

    border:2px solid #dce5e6;
}


/* =========================
   HEADLIGHT
========================= */

.headlight{
    position:absolute;

    right:-2px;
    top:42px;

    width:8px;
    height:9px;

    background:#fffbd0;

    box-shadow:
    0 0 18px 6px
    rgba(255,245,170,.9);
}


/* =========================
   WHEELS
========================= */

.wheel{
    position:absolute;

    bottom:1px;

    width:35px;
    height:35px;

    background:#111516;

    border:4px solid #070808;

    border-radius:50%;

    animation:
    wheelSpin
    .3s
    linear
    infinite;
}

.wheel:after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    width:12px;
    height:12px;

    background:#aab0b2;

    border-radius:50%;
}

.wheel-back{
    left:25px;
}

.wheel-front{
    right:23px;
}


/* =========================
   SIREN
========================= */

.siren{
    position:absolute;

    left:90px;
    top:-2px;

    width:43px;
    height:14px;

    background:#222;

    border:1px solid white;

    border-radius:3px;

    overflow:hidden;

    z-index:30;

    box-shadow:
    0 0 20px red,
    0 0 20px blue;
}

.siren-red{
    position:absolute;

    left:0;
    top:0;

    width:50%;
    height:100%;

    background:red;

    animation:
    redFlash
    .22s
    infinite;
}

.siren-blue{
    position:absolute;

    right:0;
    top:0;

    width:50%;
    height:100%;

    background:#087dff;

    animation:
    blueFlash
    .22s
    infinite;
}


/* =========================
   SIREN BUTTON
========================= */

.siren-button{
    position:absolute;

    left:50%;
    top:5%;

    transform:translateX(-50%);

    z-index:100;

    padding:10px 18px;

    border:0;

    border-radius:25px;

    background:rgba(0,0,0,.65);

    color:white;

    font-weight:bold;

    cursor:pointer;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes ambulanceSpeed{

    0%{
        left:-240px;
    }

    25%{
        left:15%;
    }

    50%{
        left:38%;
    }

    75%{
        left:58%;
    }

    100%{
        left:72%;
    }
}


@keyframes wheelSpin{

    from{
        transform:rotate(0);
    }

    to{
        transform:rotate(360deg);
    }
}


@keyframes redFlash{

    0%,49%{
        opacity:1;
    }

    50%,100%{
        opacity:.1;
    }
}


@keyframes blueFlash{

    0%,49%{
        opacity:.1;
    }

    50%,100%{
        opacity:1;
    }
}


@keyframes roadMove{

    from{
        background-position:0;
    }

    to{
        background-position:-145px;
    }
}


@keyframes speedLine{

    0%{
        transform:translateX(100vw);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateX(-300px);
        opacity:0;
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .hospital{
        width:310px;
        height:175px;
        right:2%;
        bottom:42%;
    }

    .hospital-name{
        font-size:11px;
        padding:7px 12px;
    }

    .window{
        width:38px;
        height:42px;
    }

    .entrance{
        width:85px;
        height:115px;
    }

    .ambulance{
        transform:scale(.78);
        transform-origin:bottom left;
    }
}

</style>
</head>


<body>

<div class="scene">

    <div class="sky"></div>

    <div class="trees"></div>


    <!-- HOSPITAL -->

    <div class="hospital">

        <div class="hospital-name">
            SAMARTEX HOSPITAL
        </div>

        <div class="windows">

            <div class="window"></div>
            <div class="window"></div>
            <div class="window"></div>

        </div>

        <div class="entrance"></div>

    </div>


    <!-- COMPOUND -->

    <div class="compound"></div>


    <!-- ROAD -->

    <div class="road"></div>


    <!-- SPEED LINES -->

    <div class="speed-lines">

        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- AMBULANCE -->

    <div class="ambulance">

        <div class="body">

            <div class="cross"></div>

            <div class="name">
                SAMARTEX
            </div>

            <div class="cab">

                <div class="windshield"></div>

                <div class="side-window"></div>

            </div>

            <div class="red-stripe"></div>

            <div class="headlight"></div>

        </div>


        <!-- SIREN -->

        <div class="siren">

            <div class="siren-red"></div>

            <div class="siren-blue"></div>

        </div>


        <!-- WHEELS -->

        <div class="wheel wheel-back"></div>

        <div class="wheel wheel-front"></div>

    </div>


    <!-- SOUND BUTTON -->

    <button
        class="siren-button"
        id="sirenButton">

        🔊 ACTIVATE WEE-WOO

    </button>

</div>


<script>

/* ==========================================
   WEE-WOO SIREN
========================================== */

let audioContext;
let oscillator;
let gain;
let sirenTimer;

function startSiren(){

    if(oscillator){
        return;
    }

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext){
        return;
    }

    audioContext =
        new AudioContext();

    oscillator =
        audioContext.createOscillator();

    gain =
        audioContext.createGain();


    oscillator.type =
        "square";


    gain.gain.value =
        0.15;


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    let high = false;


    function weeWoo(){

        if(!oscillator){
            return;
        }

        high = !high;

        oscillator.frequency
        .setTargetAtTime(
            high ? 950 : 480,
            audioContext.currentTime,
            .04
        );


        sirenTimer =
            setTimeout(
                weeWoo,
                550
            );
    }


    weeWoo();


    document.getElementById(
        "sirenButton"
    ).textContent =
        "🚨 WEE-WOO ACTIVE";
}


/* ==========================================
   BUTTON
========================================== */

document.getElementById(
    "sirenButton"
).addEventListener(
    "click",
    startSiren
);


/* ==========================================
   MOBILE TOUCH
========================================== */

document.addEventListener(
    "touchstart",
    startSiren,
    {
        once:true,
        passive:true
    }
);

</script>

</body>
</html>
