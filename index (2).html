<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samartex Hospital - Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="login-box">

    <center>
  <img src="/logo.png" alt="Samartex Hospital Logo" width="300">
    </center>

   
    <p>Admin Login</p>

    <form id="loginForm">

      <label>Username</label>
      <input
        type="text"
        id="username"
        placeholder="Enter username"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">Login</button>

      <div id="message"></div>

    </form>

  </div>

  <script src="script1.js"></script>

</body>
</html>
